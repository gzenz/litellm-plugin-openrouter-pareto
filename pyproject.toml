[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-plugin-openrouter-pareto"
version = "0.2.1"
description = "Pareto-optimal OpenRouter provider chooser for LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gideon Zenz" }]
keywords = ["litellm", "openrouter", "routing", "pareto"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "litellm>=1.94.0",
  "httpx>=0.27",
  "pydantic>=2",
  "platformdirs>=4",
  "filelock>=3.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_plugin_openrouter_pareto"]

[tool.hatch.build.targets.sdist]
exclude = [
  "CLAUDE.local.md",
  ".code-review-graph/**",
  "dist/**",
  "uv.lock",
  "tests/e2e/proxy.log",
  "tests/e2e/proxy_429.log",
  "tests/e2e/or_pareto_config.yaml",
  "tests/e2e/or_429_integration_config.yaml",
  "*.tmp",
  ".venv/**",
  "venv/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".pyright/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
